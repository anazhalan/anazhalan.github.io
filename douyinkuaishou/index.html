        nav a {

        }

        nav a:hover {

        }

        .search-bar {

        .tags {

            gap: 0.5rem;

            color: var(--text-sub);
            text-decoration: none;
            font-weight: normal;
        }

        /* Video Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .thumbnail-wrapper {
            position: relative;
            padding-top: 140%; /* 5:7 Aspect Ratio */
            background: #eee;
        }

        .thumbnail {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .video-card:hover .thumbnail {
            transform: scale(1.05);
        }

        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            opacity: 0.9;

        .duration {

            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .card-body {
            padding: 1rem;
        }

        .video-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .author {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .author-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #ddd;
        }

        .likes {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Filter Bar */
        .filter-bar {
            background: #fff;
            padding: 1rem;
            margin-bottom: 2rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            white-space: nowrap;
        }

        .filter-btn {
            background: #f1f2f6;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            color: var(--text-sub);
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--primary-color);
            color: #fff;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-sub);
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Footer */
        footer {
            background: #2d3436;
            color: #dfe6e9;
            padding: 3rem 1rem;
            text-align: center;

        }

        .footer-links {

        /* Responsive */

            }
            
            nav ul {
                gap: 1rem;
                font-size: 0.9rem;
            }

            .hero h1 {

    </style>
</head>

<script>
    // Mock Data Generation
    const titles = [
        "夏日海边比基尼挑战，这个动作太绝了！🔥",
        "快手热门舞蹈，跟着节奏一起摇摆💃",
        "抖音爆火抖胸舞教学，零基础也能学",
        "海边度假风，这才是夏天该有的样子",
        "极限挑战，这波操作我看呆了",
        "高清实拍，感受夏日的热情与活力",
        "网红同款舞蹈，快来挑战你的反应力",
        "比基尼派对现场，气氛瞬间燃起来",
        "动感节奏，让你忍不住跟着点头",
        "最新热门视频，不容错过的精彩瞬间"
    ];

    const authors = [
        "夏日小甜心", "舞蹈达人", "潮流先锋", "快乐制造机", "海边日记", 
        "活力无限", "音乐搬运工", "热门榜主", "时尚博主", "生活记录者"
    ];

    function generateCard(index) {
        const title = titles[index % titles.length];
        const author = authors[index % authors.length];
        const likes = Math.floor(Math.random() * 50000) + 1000;
        const views = (Math.random() * 100 + 10).toFixed(1) + '万';
        const duration = Math.floor(Math.random() * 30) + 15 + "秒";
        const seed = `video_${index}_${Date.now()}`; // Ensure unique images
        
        // Using picsum with specific dimensions and a random seed to simulate different videos
        const thumbUrl = `https://picsum.photos/seed/${seed}/400/560`;

        return `
            <article class="video-card" onclick="playVideo('${title}')">
                <div class="thumbnail-wrapper">
                    <img src="${thumbUrl}" alt="${title}" class="thumbnail" loading="lazy">
                    <div class="play-icon">▶</div>
                    <span class="duration">${duration}</span>
                </div>
                <div class="card-body">
                    <h3 class="video-title">${title}</h3>
                    <div class="video-meta">
                        <div class="author">
                            <div class="author-avatar"></div>
                            <span>${author}</span>
                        </div>
                        <div class="likes">
                            ❤️ ${likes.toLocaleString()}
                        </div>
                    </div>
                </div>
            </article>
        `;
    }

    const grid = document.getElementById('videoGrid');
    const loading = document.getElementById('loadingIndicator');

    // Initial Load
    function loadVideos(count = 10) {
        let html = '';
        for (let i = 0; i < count; i++) {
            html += generateCard(i);
        }
        grid.innerHTML += html;
    }

    loadVideos(12);

    // Infinite Scroll Simulation
    window.addEventListener('scroll', () => {
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
            loading.style.display = 'block';
            setTimeout(() => {
                loadVideos(6);
                loading.style.display = 'none';
            }, 1000);
        }
    });

    // Filter Interaction
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            grid.innerHTML = '';
            loadVideos(12);
        });
    });

    // Simple Play Interaction
    function playVideo(title) {
        // In a real app, this would navigate or open a modal
        console.log(`Playing video: ${title}`);
        // Visual feedback
        const card = document.activeElement.closest('.video-card');
        if(card) {
            card.style.transform = 'scale(0.98)';
            setTimeout(() => {
                card.style.transform = '';
            }, 200);
        }
    }
</script>
